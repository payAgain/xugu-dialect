# Local reference defaults only — override with env in any shared/CI/prod environment.
# Do NOT commit production secrets.

spring:
  application:
    name: demo-spring-boot
  flyway:
    # Default off so offline mvn test and ddl-auto=update IT stay unchanged.
    # DemoFlywayIT enables explicitly (I-007 P-005 B-FLY-001).
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  datasource:
    # Prefer env XUGU_JDBC_URL; default includes compatiblemode=NONE (Charter).
    url: ${XUGU_JDBC_URL:jdbc:xugu://127.0.0.1:5138/SYSTEM?compatiblemode=NONE}
    username: ${XUGU_USER:SYSDBA}
    password: ${XUGU_PASSWORD:SYSDBA}
    driver-class-name: com.xugu.cloudjdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        # Explicit dialect for clarity. DialectResolver SPI also works when unset
        # (META-INF/services/...DialectResolver in xugu-dialect).
        dialect: com.xugu.dialect.XuguDialect
        type:
          # Align UUID mapping with UuidAsVarcharConverter + varchar(36) (A-TYP-012; I-008 Q3)
          preferred_uuid_jdbc_type: VARCHAR
        jdbc:
          time_zone: UTC
        query:
          hql:
            # Required for Boot consumer HQL json_value / json_arrayagg (A-FUN-017 / C-JSON-001)
            json_functions_enabled: true

# When true (default), ApplicationRunner persists/finds a HIB_DEMO_PERSON row on startup.
xugu:
  demo:
    startup-crud: true
